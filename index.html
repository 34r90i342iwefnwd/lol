<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Lilly ♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@500;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --cream: #fbf7f2;
      --cream-warm: #f4ebe2;
      --ink: #2c1e22;
      --ink-soft: #755860;
      --blush: #f2d3dc;
      --rose: #b84a5e;
      --rose-deep: #9c384b;
      --sage: #648468;
      --sage-soft: #8faa92;
      --plate-bg: #100d12;
      --plate-border: rgba(44, 30, 34, 0.16);
      --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
      --sans: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono: "JetBrains Mono", "Fira Code", "Cascadia Code", Consolas, "Courier New", monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background-color: var(--cream);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      position: relative;
      overflow-x: hidden;
      background-image:
        radial-gradient(circle at 18% 15%, rgba(242, 211, 220, 0.36) 0%, transparent 45%),
        radial-gradient(circle at 84% 82%, rgba(143, 170, 146, 0.18) 0%, transparent 44%),
        radial-gradient(circle at 50% 50%, var(--cream) 0%, var(--cream-warm) 100%);
    }

    .ambient-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .mote {
      position: absolute;
      bottom: -36px;
      user-select: none;
      opacity: 0;
      animation: floatUp linear infinite;
      will-change: transform, opacity;
    }

    .mote--petal {
      width: 10px;
      height: 14px;
      border-radius: 70% 10% 70% 10%;
      background: rgba(232, 169, 185, 0.34);
    }

    .mote--leaf {
      width: 9px;
      height: 15px;
      border-radius: 80% 0 80% 0;
      background: rgba(122, 156, 126, 0.24);
    }

    .mote--heart {
      font-family: var(--serif);
      font-size: 13px;
      color: rgba(184, 74, 94, 0.32);
    }

    @keyframes floatUp {
      0% {
        transform: translate3d(0, 0, 0) rotate(0deg);
        opacity: 0;
      }
      15% { opacity: 0.72; }
      85% { opacity: 0.52; }
      100% {
        transform: translate3d(var(--drift, 24px), -108vh, 0) rotate(var(--spin, 120deg));
        opacity: 0;
      }
    }

    main {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: clamp(12px, 2.5vh, 28px) clamp(12px, 3.5vw, 24px);
    }

    .screen {
      width: 100%;
      max-width: 780px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: opacity 0.65s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .screen.is-leaving {
      opacity: 0;
      transform: translateY(-12px) scale(0.985);
      pointer-events: none;
    }

    .screen.is-hidden {
      display: none;
    }

    .screen.is-entering {
      opacity: 0;
      transform: translateY(14px) scale(0.99);
    }

    /* Screen 1: The Question */
    .photo-frame {
      background: #ffffff;
      padding: 6px;
      border-radius: 16px;
      border: 1px solid rgba(184, 74, 94, 0.14);
      box-shadow:
        0 16px 38px rgba(84, 46, 55, 0.10),
        0 3px 10px rgba(84, 46, 55, 0.05);
      margin-bottom: clamp(14px, 2.4vh, 22px);
      animation: gentleArrive 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .photo-frame img {
      display: block;
      width: auto;
      height: auto;
      max-width: min(68vw, 240px);
      max-height: min(34dvh, 250px);
      border-radius: 11px;
      object-fit: contain;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 6px;
      font-family: var(--serif);
      font-style: italic;
      font-weight: 500;
      font-size: clamp(1.1rem, 2.2vw, 1.32rem);
      letter-spacing: 0.03em;
      color: var(--rose);
      animation: gentleArrive 0.8s 0.08s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .eyebrow::before,
    .eyebrow::after {
      content: "";
      display: inline-block;
      width: 22px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--sage-soft), transparent);
      opacity: 0.85;
    }

    h1 {
      margin: 0 0 8px;
      font-family: var(--serif);
      font-weight: 600;
      font-size: clamp(2rem, 5vw, 2.95rem);
      line-height: 1.1;
      letter-spacing: -0.01em;
      color: var(--ink);
      animation: gentleArrive 0.85s 0.14s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .subtitle {
      margin: 0 0 clamp(18px, 3vh, 28px);
      font-size: clamp(0.95rem, 2vw, 1.05rem);
      font-weight: 400;
      color: var(--ink-soft);
      line-height: 1.5;
      animation: gentleArrive 0.85s 0.20s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      min-height: 52px;
      animation: gentleFade 0.85s 0.26s ease both;
    }

    .btn {
      appearance: none;
      border: none;
      font-family: var(--sans);
      font-size: 0.98rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      padding: 13px 34px;
      border-radius: 999px;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition:
        transform 0.24s cubic-bezier(0.22, 1, 0.36, 1),
        background-color 0.24s ease,
        box-shadow 0.24s ease,
        border-color 0.24s ease;
    }

    .btn-yes {
      position: relative;
      z-index: 35;
      background-color: var(--rose);
      color: #fffdf9;
      box-shadow:
        0 8px 22px rgba(184, 74, 94, 0.26),
        0 2px 6px rgba(184, 74, 94, 0.16);
    }

    .btn-yes:hover {
      background-color: var(--rose-deep);
      transform: translateY(-2px) scale(1.025);
      box-shadow:
        0 12px 26px rgba(156, 56, 75, 0.32),
        0 4px 10px rgba(156, 56, 75, 0.18);
    }

    .btn-yes:active {
      transform: translateY(0) scale(0.985);
    }

    .btn-yes:focus-visible {
      outline: 2px solid var(--sage);
      outline-offset: 3px;
    }

    .btn-no {
      position: relative;
      z-index: 25;
      background-color: #fffaf7;
      color: var(--ink-soft);
      border: 1px solid rgba(184, 74, 94, 0.24);
      box-shadow: 0 4px 12px rgba(70, 38, 46, 0.06);
    }

    .btn-no.is-evading {
      position: fixed;
      left: 0;
      top: 0;
      margin: 0;
      z-index: 28;
      transform-origin: center center;
      will-change: transform;
      transition:
        transform 0.25s cubic-bezier(0.22, 1.12, 0.36, 1),
        opacity 0.45s ease;
    }

    .no-spacer {
      display: none;
      flex-shrink: 0;
      pointer-events: none;
      visibility: hidden;
    }

    .dodge-hint {
      margin: 12px 0 0;
      min-height: 1.4em;
      font-family: var(--serif);
      font-style: italic;
      font-size: 0.96rem;
      color: var(--sage);
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    .dodge-hint.is-visible {
      opacity: 0.92;
      transform: translateY(0);
    }

    /* Screen 2: High-Resolution 260x116 ASCII Video Bouquet */
    .bouquet-screen {
      max-width: 820px;
      gap: 0;
    }

    .bouquet-eyebrow {
      margin-bottom: clamp(8px, 1.3dvh, 13px);
      font-size: clamp(1.18rem, 2.3vw, 1.42rem);
    }

    .bouquet-stage {
      position: relative;
      background: var(--plate-bg);
      background-image: radial-gradient(circle at 50% 44%, rgba(64, 28, 46, 0.28) 0%, rgba(16, 13, 18, 0.98) 74%);
      border-radius: 16px;
      padding: clamp(8px, 1.4vw, 14px) clamp(10px, 1.8vw, 18px);
      border: 1px solid var(--plate-border);
      box-shadow:
        0 20px 48px rgba(44, 24, 30, 0.16),
        0 4px 14px rgba(44, 24, 30, 0.08),
        inset 0 0 0 1px rgba(255, 240, 244, 0.05);
      max-width: 100%;
    }

    .bouquet-viewport {
      position: relative;
      overflow: hidden;
      margin: 0 auto;
    }

    .bouquet-pre {
      position: absolute;
      left: 0;
      top: 0;
      margin: 0;
      font-family: var(--mono);
      font-weight: 700;
      font-size: 10px;
      line-height: 10.6px;
      letter-spacing: 0;
      white-space: pre;
      text-align: left;
      transform-origin: top left;
      will-change: transform;
      user-select: text;
    }

    .b-row {
      height: 10.6px;
      line-height: 10.6px;
      white-space: pre;
      contain: layout style paint;
    }

    .bouquet-copy {
      margin-top: clamp(12px, 2dvh, 18px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .message-main {
      margin: 0;
      font-family: var(--serif);
      font-weight: 500;
      font-size: clamp(1.38rem, 3vw, 1.9rem);
      line-height: 1.22;
      color: var(--ink);
    }

    .message-sub {
      margin: 0;
      font-size: clamp(0.86rem, 1.8vw, 0.96rem);
      color: var(--ink-soft);
      line-height: 1.45;
    }

    .closing-ornament {
      margin-top: 6px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--rose);
      font-size: 1rem;
    }

    .leaf-accent {
      color: var(--sage);
      font-size: 0.85rem;
      opacity: 0.85;
    }

    .heart-pulse {
      display: inline-block;
      color: var(--rose);
      font-size: 1.18rem;
      line-height: 1;
      animation: heartBeat 2.2s ease-in-out infinite;
    }

    @keyframes heartBeat {
      0%, 100% { transform: scale(1); opacity: 0.92; }
      14% { transform: scale(1.2); opacity: 1; }
      28% { transform: scale(1); opacity: 0.92; }
      42% { transform: scale(1.13); opacity: 1; }
      70% { transform: scale(1); opacity: 0.92; }
    }

    .replay-btn {
      margin-top: 4px;
      appearance: none;
      border: none;
      background: transparent;
      color: var(--ink-soft);
      font-family: var(--sans);
      font-size: 0.78rem;
      letter-spacing: 0.03em;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.2s ease, color 0.2s ease, background-color 0.2s ease;
    }

    .replay-btn:hover {
      opacity: 1;
      color: var(--rose);
      background-color: rgba(184, 74, 94, 0.07);
    }

    @keyframes gentleArrive {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes gentleFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (max-width: 540px) {
      .photo-frame img {
        max-width: min(72vw, 215px);
        max-height: min(32dvh, 220px);
      }

      .btn {
        padding: 12px 28px;
        font-size: 0.95rem;
      }

      .bouquet-stage {
        padding: 8px 8px;
        border-radius: 13px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .mote, .heart-pulse {
        animation: none !important;
      }
      .screen, .btn-no.is-evading {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="ambient-layer" id="ambient-layer" aria-hidden="true"></div>

  <main>
    <!-- Screen 1: The Question -->
    <section class="screen" id="screen-question" aria-labelledby="question-heading">
      <div class="photo-frame">
        <img
          src="https://i.pinimg.com/1200x/26/b8/bc/26b8bc354a2f3bf62414ae31ae255bf6.jpg"
          alt="Cute kitten offering a flower bouquet for Lilly"
        />
      </div>

      <p class="eyebrow">For Lilly ♡</p>
      <h1 id="question-heading">Will you take my gift?</h1>
      <p class="subtitle">I made something special just for you.</p>

      <div class="actions" id="actions-row">
        <button type="button" class="btn btn-yes" id="yes-btn">Yes</button>
        <span class="no-spacer" id="no-spacer" aria-hidden="true"></span>
        <button type="button" class="btn btn-no" id="no-btn">No</button>
      </div>

      <p class="dodge-hint" id="dodge-hint" aria-live="polite"></p>
    </section>

    <!-- Screen 2: The Animated High-Res ASCII Video Bouquet -->
    <section class="screen bouquet-screen is-hidden" id="screen-bouquet" aria-labelledby="bouquet-heading">
      <p class="eyebrow bouquet-eyebrow" id="bouquet-heading">For Lilly ♡</p>

      <div class="bouquet-stage">
        <div class="bouquet-viewport" id="bouquet-viewport">
          <pre class="bouquet-pre" id="bouquet-pre" aria-label="Animated colored ASCII video bouquet of blooming lilies"></pre>
        </div>
      </div>

      <div class="bouquet-copy">
        <p class="message-main">Just a little something to make you smile.</p>
        <p class="message-sub">You deserve all the flowers in the world.</p>
        <div class="closing-ornament" aria-hidden="true">
          <span class="leaf-accent">❦</span>
          <span class="heart-pulse">♡</span>
          <span class="leaf-accent">❦</span>
        </div>
        <button type="button" class="replay-btn" id="replay-btn">↻ Replay bloom</button>
      </div>
    </section>
  </main>

  <script>

      // --- 1. Subtle Ambient Floating Motes ---
      function initAmbientMotes() {
        const layer = document.getElementById("ambient-layer");
        if (!layer) return;
        const count = window.innerWidth < 600 ? 11 : 16;
        for (let i = 0; i < count; i++) {
          const el = document.createElement("span");
          const kind = i % 5 === 0 ? "heart" : i % 3 === 0 ? "leaf" : "petal";
          el.className = "mote mote--" + kind;
          if (kind === "heart") el.textContent = "♡";
          el.style.left = (4 + ((i * 93) / count) % 92).toFixed(1) + "vw";
          el.style.animationDuration = (13 + (i % 6) * 2.7).toFixed(1) + "s";
          el.style.animationDelay = (-((i * 2.1) % 16)).toFixed(1) + "s";
          el.style.setProperty("--drift", ((i % 2 === 0 ? 1 : -1) * (14 + (i % 4) * 9)) + "px");
          el.style.setProperty("--spin", ((i % 2 === 0 ? 1 : -1) * (80 + (i % 5) * 35)) + "deg");
          layer.appendChild(el);
        }
      }

      // --- 2. Playful "No" Button Evasion (always visible inside viewport, impossible to hover/click) ---
      const screenQuestion = document.getElementById("screen-question");
      const screenBouquet = document.getElementById("screen-bouquet");
      const yesBtn = document.getElementById("yes-btn");
      const noBtn = document.getElementById("no-btn");
      const noSpacer = document.getElementById("no-spacer");
      const dodgeHint = document.getElementById("dodge-hint");

      const HINT_LINES = [
        "That button seems a little shy…",
        "Nice try, Lilly ♡",
        "I think the other button likes you better.",
        "Still waiting right over there ♡"
      ];

      let evading = false;
      let accepted = false;
      let noX = 0;
      let noY = 0;
      let noW = 0;
      let noH = 0;
      let dodgeCount = 0;
      let lastDodgeAt = 0;

      function distToRect(px, py, rect) {
        const dx = Math.max(rect.left - px, 0, px - rect.right);
        const dy = Math.max(rect.top - py, 0, py - rect.bottom);
        return Math.hypot(dx, dy);
      }

      function rectsOverlap(a, b, margin) {
        return !(
          a.right + margin < b.left ||
          a.left - margin > b.right ||
          a.bottom + margin < b.top ||
          a.top - margin > b.bottom
        );
      }

      function clampToViewport(x, y, width, height, pad) {
        const maxX = Math.max(pad, window.innerWidth - width - pad);
        const maxY = Math.max(pad, window.innerHeight - height - pad);
        return {
          x: Math.min(Math.max(pad, x), maxX),
          y: Math.min(Math.max(pad, y), maxY)
        };
      }

      function detachNoButtonIfNeeded() {
        if (evading) return;
        const rect = noBtn.getBoundingClientRect();
        noW = rect.width;
        noH = rect.height;

        noSpacer.style.width = noW + "px";
        noSpacer.style.height = noH + "px";
        noSpacer.style.display = "inline-block";

        // Move directly onto body so position:fixed is immune to ancestor transforms
        document.body.appendChild(noBtn);

        noX = rect.left;
        noY = rect.top;
        noBtn.style.transition = "none";
        noBtn.classList.add("is-evading");
        noBtn.style.transform = `translate3d(${noX}px, ${noY}px, 0)`;
        void noBtn.offsetWidth;
        noBtn.style.transition = "";
        evading = true;
      }

      function pickSafePosition(cursorX, cursorY) {
        const pad = window.innerWidth < 540 ? 18 : 28;
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const availW = Math.max(10, vw - noW - pad * 2);
        const availH = Math.max(10, vh - noH - pad * 2);
        const yesRect = yesBtn.getBoundingClientRect();

        const candidates = [];
        let fallback = null;
        let fallbackScore = -Infinity;

        for (let i = 0; i < 60; i++) {
          const cx = pad + Math.random() * availW;
          const cy = pad + Math.random() * availH;
          const candRect = {
            left: cx,
            top: cy,
            right: cx + noW,
            bottom: cy + noH
          };

          if (rectsOverlap(candRect, yesRect, 26)) continue;

          const centerX = cx + noW / 2;
          const centerY = cy + noH / 2;
          const distCursor = Math.hypot(centerX - cursorX, centerY - cursorY);
          const distSelf = Math.hypot(cx - noX, cy - noY);
          const score = distCursor + Math.min(distSelf, 240) * 0.45;

          if (score > fallbackScore) {
            fallbackScore = score;
            fallback = { x: cx, y: cy };
          }

          if (distCursor > Math.min(200, vw * 0.42) && distSelf > 105) {
            candidates.push({ x: cx, y: cy });
          }
        }

        const chosen = candidates.length > 0
          ? candidates[Math.floor(Math.random() * candidates.length)]
          : (fallback || clampToViewport(pad, pad, noW, noH, pad));

        return clampToViewport(chosen.x, chosen.y, noW, noH, pad);
      }

      function dodgeFrom(px, py, force = false) {
        if (accepted) return;
        const now = performance.now();
        if (!force && now - lastDodgeAt < 60) return;

        detachNoButtonIfNeeded();

        const target = pickSafePosition(px, py);
        noX = target.x;
        noY = target.y;
        lastDodgeAt = now;

        const tilt = (Math.random() * 5 - 2.5).toFixed(1);
        noBtn.style.transform = `translate3d(${noX.toFixed(1)}px, ${noY.toFixed(1)}px, 0) rotate(${tilt}deg)`;

        dodgeCount += 1;
        if (dodgeCount >= 3 && dodgeHint) {
          const idx = Math.min(HINT_LINES.length - 1, Math.floor((dodgeCount - 3) / 3));
          dodgeHint.textContent = HINT_LINES[idx];
          dodgeHint.classList.add("is-visible");
        }
      }

        if (accepted || e.pointerType === "touch") return;
        const rect = noBtn.getBoundingClientRect();
        if (distToRect(e.clientX, e.clientY, rect) < 105) {
          dodgeFrom(e.clientX, e.clientY);
        }
      }

      document.addEventListener("mousemove", checkPointerProximity);

          dodgeFrom(t.clientX, t.clientY);

        e.preventDefault();
        const rect = noBtn.getBoundingClientRect();
        dodgeFrom(rect.left + rect.width / 2, rect.top + rect.height / 2, true);
      });

      window.addEventListener("resize", () => {
        if (evading && !accepted) {
          const pad = window.innerWidth < 540 ? 18 : 28;
          const clamped = clampToViewport(noX, noY, noW, noH, pad);
          noX = clamped.x;
          noY = clamped.y;
          const yesRect = yesBtn.getBoundingClientRect();
          const testRect = { left: noX, top: noY, right: noX + noW, bottom: noY + noH };
          if (rectsOverlap(testRect, yesRect, 22)) {
            const moved = pickSafePosition(yesRect.left + yesRect.width / 2, yesRect.top + yesRect.height / 2);
            noX = moved.x;
            noY = moved.y;
          }
          noBtn.style.transform = `translate3d(${noX.toFixed(1)}px, ${noY.toFixed(1)}px, 0)`;
        }
        if (accepted) fitBouquetStage();
      });

      // --- 3. 260x116 20fps GPU-Scaled ASCII Video Engine ---
      const bouquetViewport = document.getElementById("bouquet-viewport");
      const bouquetPre = document.getElementById("bouquet-pre");
      const replayBtn = document.getElementById("replay-btn");

      const COLS = BOUQUET_DATA.w;
      const ROWS = BOUQUET_DATA.h;
      const PAL = BOUQUET_DATA.p;
      const PAL_CHARS = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      const PAL_MAP = Object.create(null);
      for (let i = 0; i < PAL_CHARS.length; i++) PAL_MAP[PAL_CHARS[i]] = i;

      function escHtml(s) {
        return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      // Decode & pre-cache every unique row string -> fast CSS-colored <span> groups HTML
      const rowHtmlCache = new Array(BOUQUET_DATA.r.length);
      const rowDecodedRuns = new Array(BOUQUET_DATA.r.length);

      function getRowHtml(rowId) {
        if (rowHtmlCache[rowId] !== undefined) return rowHtmlCache[rowId];
        const parts = BOUQUET_DATA.r[rowId].split("^");
        let html = "";
        const runs = [];
        for (let i = 0; i < parts.length; i++) {
          const seg = parts[i];
          if (!seg) continue;
          if (seg[0] === "-") {
            const n = parseInt(seg.slice(1), 10);
            const sp = " ".repeat(n);
            html += sp;
            runs.push([null, sp]);
          } else {
            const col = PAL[PAL_MAP[seg[0]]];
            const txt = seg.slice(1);
            html += `<span style="color:${col}">${escHtml(txt)}</span>`;
            runs.push([col, txt]);
          }
        }
        rowHtmlCache[rowId] = html;
        rowDecodedRuns[rowId] = runs;
        return html;
      }

      // Warm cache on idle/init so playback has zero decode stutter
      for (let i = 0; i < BOUQUET_DATA.r.length; i++) getRowHtml(i);

      let rowEls = [];
      let currentRowIds = new Array(ROWS).fill(-1);
      let rafId = null;
      let natW = 0;
      let natH = 0;

      function buildRowElements() {
        bouquetPre.innerHTML = "";
        rowEls = [];
        const frag = document.createDocumentFragment();
        for (let r = 0; r < ROWS; r++) {
          const div = document.createElement("div");
          div.className = "b-row";
          if (r === 0) div.textContent = " ".repeat(COLS);
          frag.appendChild(div);
          rowEls.push(div);
        }
        bouquetPre.appendChild(frag);
        natW = bouquetPre.scrollWidth || COLS * 6;
        natH = bouquetPre.scrollHeight || ROWS * 10.6;
        rowEls[0].textContent = "";
        currentRowIds.fill(-1);
      }

      function fitBouquetStage() {
        if (!natW || !natH) return;
        const isMobile = window.innerWidth < 540;
        const maxW = Math.min(window.innerWidth - (isMobile ? 42 : 76), 545);
        const maxH = Math.min(window.innerHeight * (isMobile ? 0.43 : 0.56), 415);
        const scale = Math.min(maxW / natW, maxH / natH);
        bouquetViewport.style.width = Math.round(natW * scale) + "px";
        bouquetViewport.style.height = Math.round(natH * scale) + "px";
        bouquetPre.style.transform = `scale(${scale.toFixed(4)})`;
      }

      function renderFrame(frameIdx) {
        const fIds = BOUQUET_DATA.f[frameIdx];
        for (let r = 0; r < ROWS; r++) {
          const id = fIds[r];
          if (currentRowIds[r] !== id) {
            currentRowIds[r] = id;
            rowEls[r].innerHTML = rowHtmlCache[id];
          }
        }
      }

      function renderPartialPrefixRow(rowId, maxCols) {
        const runs = rowDecodedRuns[rowId];
        let html = "";
        let count = 0;
        for (let i = 0; i < runs.length; i++) {
          if (count >= maxCols) break;
          const [col, txt] = runs[i];
          const take = Math.min(txt.length, maxCols - count);
          const slice = take === txt.length ? txt : txt.slice(0, take);
          html += col ? `<span style="color:${col}">${escHtml(slice)}</span>` : slice;
          count += take;
        }
        return html;
      }

      function stopAnimation() {
        if (rafId !== null) {
          cancelAnimationFrame(rafId);
          rafId = null;
        }
      }

      function playBouquetVideo() {
        stopAnimation();
        if (rowEls.length === 0) buildRowElements();
        fitBouquetStage();

        for (let r = 0; r < ROWS; r++) {
          rowEls[r].innerHTML = "";
          currentRowIds[r] = -1;
        }

        // Phase 1: Silky 60fps character-by-character emergence (stems -> bow -> leaves -> buds)
        const f0 = BOUQUET_DATA.f[0];
        const emergeMs = 1550;
        const emergeStart = performance.now();

        // Phase 2: Continuous 20fps ASCII timelapse video loop
        const totalFrames = BOUQUET_DATA.f.length;
        const timeline = [];
        for (let i = 0; i < totalFrames; i++) {
          // Hold slightly longer on the radiant full-bloom frames (20..23) before gentle loop crossfade
          const dur = (i >= 20 && i <= 23) ? 280 : 55;
          timeline.push({ idx: i, dur });
        }

        let phase = "emerge";
        let tlStep = 0;
        let lastFrameTime = 0;

        function frameTick(now) {
          if (phase === "emerge") {
            const p = Math.min(1, (now - emergeStart) / emergeMs);
            // Sweep rows smoothly from bottom (ROWS-1) up to top (0), revealing characters left-to-right per row
            const front = p * (ROWS + 16);
            for (let r = 0; r < ROWS; r++) {
              const revR = ROWS - 1 - r;
              const local = front - revR;
              if (local <= 0) continue;
              if (local >= 16) {
                const id = f0[r];
                if (currentRowIds[r] !== id) {
                  currentRowIds[r] = id;
                  rowEls[r].innerHTML = rowHtmlCache[id];
                }
              } else {
                const showCols = Math.ceil((local / 16) * COLS);
                rowEls[r].innerHTML = renderPartialPrefixRow(f0[r], showCols);
              }
            }

            if (p >= 1) {
              renderFrame(0);
              phase = "video";
              tlStep = 1;
              lastFrameTime = now;
            }
            rafId = requestAnimationFrame(frameTick);
            return;
          }

          // Video playback loop driven by rAF timestamps for rock-steady frame pacing
          const cur = timeline[tlStep];
          if (now - lastFrameTime >= cur.dur) {
            renderFrame(cur.idx);
            lastFrameTime = now;
            tlStep = (tlStep + 1) % timeline.length;
          }
          rafId = requestAnimationFrame(frameTick);
        }

        rafId = requestAnimationFrame(frameTick);
      }

      // --- 4. Transition from Screen 1 to Screen 2 ---
      yesBtn.addEventListener("click", () => {
        if (accepted) return;
        accepted = true;

        if (evading) {
          noBtn.style.opacity = "0";
          noBtn.style.pointerEvents = "none";
        }

        screenQuestion.classList.add("is-leaving");

        setTimeout(() => {
          screenQuestion.classList.add("is-hidden");
          if (evading) noBtn.remove();

          screenBouquet.classList.remove("is-hidden");
          screenBouquet.classList.add("is-entering");
          buildRowElements();
          fitBouquetStage();

          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              screenBouquet.classList.remove("is-entering");
              setTimeout(playBouquetVideo, 180);
            });
          });
        }, 580);
      });

      replayBtn.addEventListener("click", () => {
        playBouquetVideo();
      });

      initAmbientMotes();
    })();
  </script>
</body>
</html>
